services:
  - type: web
    name: short-shipment-api
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: API_ADMIN_USERNAME
        sync: false
      - key: API_ADMIN_PASSWORD
        sync: false
