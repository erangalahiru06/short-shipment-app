services:
  - type: web
    name: short-shipment-api
    runtime: python
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: API_ADMIN_USERNAME
        sync: false
      - key: API_ADMIN_PASSWORD
        sync: false
      - key: API_DB_PATH
        value: /var/data/shipment_api.sqlite3
    disk:
      name: short-shipment-data
      mountPath: /var/data
      sizeGB: 1
